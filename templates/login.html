<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Container Stitch Tester</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-navy min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-600/30 mb-3">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      </div>
      <h1 class="text-white font-bold text-lg">Container Stitch Tester</h1>
      <p class="text-slate-400 text-xs mt-1">Stitch. Compare. Validate. — private demo</p>
    </div>

    <form method="post" class="bg-card rounded-2xl shadow-2xl p-6 space-y-4" autocomplete="off">
      <div>
        <label for="password" class="text-xs font-semibold text-ink">Password</label>
        <input type="password" id="password" name="password" required autofocus
               placeholder="Enter the demo password"
               class="input-field w-full mt-1">
      </div>
      {% if error %}
        <p class="text-red-500 text-xs font-medium" role="alert">⚠ {{ error }}</p>
      {% endif %}
      <button type="submit" class="btn-primary w-full !py-2 text-xs justify-center">Sign in</button>
      <p class="text-[10px] text-mute leading-snug">Non-generative OpenCV stitching. Sessions persist in this
        browser until you sign out. The operator's AI endpoints are configured server-side and are never exposed.</p>
    </form>
  </div>
</body>
</html>
