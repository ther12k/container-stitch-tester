{% if jobs %}
  <div class="space-y-1.5">
    {% for job in jobs %}
      <div class="job-row !py-1.5 !px-2 cursor-pointer" data-job-id="{{ job.job_id }}" onclick="selectJob('{{ job.job_id }}')">
        {% if job.thumb_url %}
          <img src="{{ job.thumb_url }}" alt="" loading="lazy"
               class="w-10 h-7 object-cover rounded border border-line bg-white shrink-0">
        {% else %}
          <div class="w-10 h-7 rounded border border-line bg-soft shrink-0 flex items-center justify-center">
            <svg class="w-3 h-3 text-mute" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          </div>
        {% endif %}
        <div class="min-w-0 grow">
          <p class="text-[11px] font-semibold truncate leading-tight">{{ job.label }}</p>
          <p class="text-[9px] text-mute">{{ job.ago }}</p>
        </div>
        <div class="shrink-0 flex items-center gap-1.5">
          {% if job.runtime_ms %}<span class="text-[9px] text-mute">{{ '%.1f' % (job.runtime_ms / 1000) }}s</span>{% endif %}
          <span class="badge {{ 'badge-err' if job.status == 'rejected' else
                              'badge-sky' if job.quality_state == 'rectified_only' else
                              'badge-amber' if job.quality_state == 'unverified_edge_composite' else
                              'badge-violet' if job.quality_state == 'overlap_requires_visual_review' else
                              'badge-ok' if 'reject' not in job.status and job.status != 'unknown' else
                              'badge-mute' }}">{{ job.status }}</span>
          <button hx-post="/delete-job/{{ job.job_id }}" hx-target="#jobs" hx-confirm="Delete this job output?"
                  onclick="event.stopPropagation()"
                  class="w-5 h-5 rounded text-mute hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition-colors" title="Delete">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <p class="text-xs text-mute text-center py-3">No jobs yet — run an example.</p>
{% endif %}
