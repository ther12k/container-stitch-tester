name: security

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-private-assets:
    name: No private sample assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if private bundle paths are tracked
        run: |
          bad=$(git ls-tree -r --name-only HEAD | grep -E \
            '^(sources|examples)/|preview_all\.jpg$|^gallery\.html$|^sample_gallery\.html$|^\.venv/|^web_jobs/|^web_uploads/' || true)
          if [ -n "$bad" ]; then
            echo "Private assets detected in the tree:"; echo "$bad"; exit 1
          fi
      - name: Fail on secret-shaped strings in tracked files
        run: |
          if git grep -Eq 'sk-[A-Za-z0-9_-]{10,}' HEAD -- .; then
            git grep -En 'sk-[A-Za-z0-9_-]{10,}' HEAD -- .; exit 1
          fi
